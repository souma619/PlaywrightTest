trigger: none

schedules:
  - cron: "0 10 * * *"  # 2 AM PDT = 9 AM UTC
    displayName: "Nightly Playwright Run (2AM PDT)"
    branches:
      include:
        - main
    always: true

variables:
  - name: definitionId
    value: '90'
  - group: qe-test-automation-variables

parameters:

  - name: environment
    displayName: "Environment"
    type: string
    values:
      - dev
      - uat
      - int
    default: uat

  - name: runAll
    displayName: "Run Complete Test Regression (Un-check to select specific suites)"
    type: boolean
    default: true

  - name: runSmokePage
    displayName: "SmokePage Test Suite"
    type: boolean
    default: false

  - name: runHomePage
    displayName: "HomePage Test Suite"
    type: boolean
    default: false

  - name: runUniversalHeaderPage
    displayName: "UniversalHeaderPage Test Suite"
    type: boolean
    default: false

  - name: runConnectNowPage
    displayName: "ConnectNow Test Suite"
    type: boolean
    default: false

  - name: runStylePage
    displayName: "StylePage Test Suite"
    type: boolean
    default: false

  - name: runAccountsPage
    displayName: "AccountsPage Test Suite"
    type: boolean
    default: false

  - name: runBudgetPage
    displayName: "BudgetPage Test Suite"
    type: boolean
    default: false

  - name: runConsolidatedProfilePage
    displayName: "ConsolidatedProfilePage Test Suite"
    type: boolean
    default: false

  - name: runDesignPage
    displayName: "DesignPage Test Suite"
    type: boolean
    default: false

  - name: runIceBreakerPage
    displayName: "IceBreakerPage Test Suite"
    type: boolean
    default: false

  - name: runVirtualDesigner
    displayName: "VirtualDesigner Test Suite"
    type: boolean
    default: false

stages:

# ══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — Setup
# ══════════════════════════════════════════════════════════════════════════════

- stage: Setup
  displayName: 'Setup'
  jobs:
  - job: Setup
    timeoutInMinutes: 60
    pool:
      name: vmss-low
    steps:

    - task: AzureCLI@2
      displayName: 'Get latest successful frontend ${{ parameters.environment }} build ID'
      inputs:
        azureSubscription: 'jumpstarter-non-prod'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Setting up Azure DevOps CLI authentication..."
          export AZURE_DEVOPS_EXT_PAT=$(ADO_TESTS_PAT)
          az devops configure --defaults organization='$(System.TeamFoundationCollectionUri)' project='$(System.TeamProject)'
          latestBuildId=$(az pipelines build list \
            --definition-ids "$(definitionId)" \
            --status "completed" \
            --result "succeeded" \
            --top 1 \
            --query "[0].id" -o tsv)
          echo "##vso[task.setvariable variable=SOURCE_BUILD_ID;isOutput=true]$latestBuildId"
          echo "Latest build ID: $latestBuildId"
      name: SetBuildId

    - bash: |
        if [ -z "$(SetBuildId.SOURCE_BUILD_ID)" ] || [ "$(SetBuildId.SOURCE_BUILD_ID)" -le 0 ]; then
          echo "##vso[task.setvariable variable=isValidBuild;isOutput=true]false"
          exit 1
        else
          echo "##vso[task.setvariable variable=isValidBuild;isOutput=true]true"
        fi
      displayName: 'Validate Source BuildID'
      name: ValidateBuild

    - task: DownloadPipelineArtifact@2
      condition: and(succeeded(), eq(variables['ValidateBuild.isValidBuild'], 'true'))
      inputs:
        buildType: 'specific'
        project: 'Digital Product and Innovation'
        pipeline: 'jumpstarter-static-website-${{ parameters.environment }}'
        runId: $(SetBuildId.SOURCE_BUILD_ID)
        targetPath: '$(Pipeline.Workspace)/downloaded'

    - script: |
        EXTRACT_DIR="$(Pipeline.Workspace)/extracted_dist"
        mkdir -p "$EXTRACT_DIR"
        INNER_ZIP=$(find "$(Pipeline.Workspace)/downloaded" -type f -name "*.zip" ! -iname "*configs*" | awk '{ print length, $0 }' | sort -nr | cut -d" " -f2- | head -n1)
        echo "Inner zip found: $INNER_ZIP"
        unzip "$INNER_ZIP" -d "$EXTRACT_DIR"
        if [ ! -d "$EXTRACT_DIR/dist" ]; then
          echo "dist folder not found!"
          exit 1
        fi
        echo "dist/ extracted to $EXTRACT_DIR/dist"
      displayName: 'Extract zip and validate dist folder'

    - script: |
        cd $(Pipeline.Workspace)/extracted_dist/dist
        npm install -g http-server
        http-server -p 3000 &
      displayName: 'Start local server'

# ══════════════════════════════════════════════════════════════════════════════
# STAGES 2–12 — Sequential, except for two parallel groups:
#   Group A (parallel, all dependOn Setup):       IceBreakerPage, StylePage, DesignPage
#   Group A merge point (waits for all of Group A): BudgetPage
#   ... sequential chain ...
#   Group B (parallel, both dependOn AccountsPage): HomePage, UniversalHeaderPage
#   Group B merge point (waits for all of Group B): ConnectNowPage
#   ... sequential chain to the end ...
#
# Each stage:
#   1. Installs Node + Playwright on its fresh agent
#   2. Runs the spec
#   3. Uploads the HTML report as a pipeline artifact (artifact root = report root)
#   4. Uploads the JUnit XML as its own pipeline artifact
# ══════════════════════════════════════════════════════════════════════════════

- stage: IceBreakerPage
  displayName: 'IceBreakerPage Test Suite'
  dependsOn: Setup
  condition: >-
    and(not(failed('Setup')),
      or(eq('${{ parameters.runAll }}', true),
         eq('${{ parameters.runIceBreakerPage }}', true)))
  jobs:
  - job: RunIceBreakerPage
    timeoutInMinutes: 180
    pool:
      name: vmss-low
    steps:
    - task: UseNode@1
      inputs:
        version: "20.x"
      displayName: 'Install Node.js'
    - script: |
        echo "Project Directory:$(System.DefaultWorkingDirectory)"
        echo "PlayWright Directory:$(System.DefaultWorkingDirectory)/Frontend/PlaywrightTests"
        sudo rm -f /var/lib/apt/lists/lock
        sudo rm -f /var/lib/dpkg/lock
        sudo rm -f /var/lib/dpkg/lock-frontend
        sudo dpkg --configure -a
        sudo apt-get clean
        sudo apt-get update --fix-missing
        sudo apt-get install -f
        npm install @playwright/test
        npm install pdf-parse
        npx playwright install --with-deps
      workingDirectory: $(System.DefaultWorkingDirectory)/Frontend/PlaywrightTests
      displayName: 'Install Playwright browsers'
      retryCountOnTaskFailure: 1
    - script: npx playwright test ui_tests/IceBreakerPageTests/iceBreakerPage_test.spec.ts
      workingDirectory: $(System.DefaultWorkingDirectory)/Frontend/PlaywrightTests
      displayName: 'Run IceBreakerPage Tests'
      continueOnError: true
      env:
        environment: ${{ parameters.environment }}
        CI: true
        grant_type: $(grant_type)
        client_id_int: $(client_id_int)
        client_secret_int: $(client_secret_int)
        client_id_uat: $(client_id_uat)
        client_secret_uat: $(client_secret_uat)
        resource: $(resource)
        base_url: $(base_url)
        user_management_url: $(user_management_url)
        createEmail: $(createEmail)
        password: $(password)
        pat: $(pat)
        base_url_iam_initial: $(base_url_iam_initial)
        base_url_iam_final: $(base_url_iam_final)
        audience_initial: $(audience_initial)
        audience_final: $(audience_final)
    - task: PublishPipelineArtifact@1
      displayName: 'Upload IceBreakerPage HTML report'
      condition: succeededOrFailed()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/Frontend/PlaywrightTests/playwright-report/html-report'
        artifact: 'html-report-IceBreakerPage'
        publishLocation: 'pipeline'
    - task: PublishPipelineArtifact@1
      displayName: 'Upload IceBreakerPage JUnit results'
      condition: succeededOrFailed()
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/Frontend/PlaywrightTests/test-results'
        artifact: 'junit-IceBreakerPage'
        publishLocation: 'pipeline'

