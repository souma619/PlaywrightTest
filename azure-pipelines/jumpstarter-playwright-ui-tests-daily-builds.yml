# ══════════════════════════════════════════════════════════════════════════════
# STAGE 13 — Publish
# Downloads all per-stage HTML report and JUnit artifacts, merges the HTML
# reports into a single browsable index.html, and publishes JUnit results.
# Runs always so nothing is missed even on partial failures or cancellation.
# ══════════════════════════════════════════════════════════════════════════════

- stage: Publish
  displayName: 'Publish Results'
  dependsOn:
    - IceBreakerPage
    - StylePage
    - DesignPage
    - BudgetPage
    - ConsolidatedProfilePage
    - AccountsPage
    - HomePage
    - UniversalHeaderPage
    - ConnectNowPage
    - VirtualDesigner
    - SmokePage
  condition: always()
  jobs:
  - job: PublishResults
    timeoutInMinutes: 30
    pool:
      name: vmss-low
    steps:

    - task: DownloadPipelineArtifact@2
      displayName: 'Download all HTML reports'
      condition: succeededOrFailed()
      inputs:
        buildType: 'current'
        targetPath: '$(Pipeline.Workspace)/all-reports'

    - script: |
        set -uo pipefail
        SOURCE_DIR='$(Pipeline.Workspace)/all-reports'
        MERGED_DIR='$(Pipeline.Workspace)/merged-html-reports'

        rm -rf "$MERGED_DIR"
        mkdir -p "$MERGED_DIR"

        echo "Listing all downloaded artifacts under $SOURCE_DIR:"
        find "$SOURCE_DIR" -maxdepth 2

        # Each downloaded artifact folder IS the report root (it was uploaded
        # directly from playwright-report/html-report, so there's no nested
        # 'html-report' subfolder to search for — match the artifact folder
        # itself by its 'html-report-<Suite>' naming convention instead.
        FOUND_ANY=false
        while IFS= read -r artifactDir; do
          suiteFolder=$(basename "$artifactDir")
          suiteName=${suiteFolder#html-report-}
          echo "Found report for suite: $suiteName (from $artifactDir)"
          cp -R "$artifactDir" "$MERGED_DIR/$suiteName"
          FOUND_ANY=true
        done < <(find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 -type d -name "html-report-*" 2>/dev/null)

        if [ "$FOUND_ANY" = false ]; then
          echo "##vso[task.logissue type=warning]No suite HTML reports were found under $SOURCE_DIR — check upstream stages' upload steps."
        fi

        {
          echo '<!doctype html>'
          echo '<html><head><meta charset="UTF-8"><title>Playwright HTML Reports</title></head><body>'
          echo '<h1>Playwright HTML Reports</h1>'
          if [ "$FOUND_ANY" = true ]; then
            echo '<ul>'
            for suitePath in "$MERGED_DIR"/*; do
              if [ -d "$suitePath" ]; then
                suiteName=$(basename "$suitePath")
                echo "<li><a href=\"$suiteName/index.html\">$suiteName</a></li>"
              fi
            done
            echo '</ul>'
          else
            echo '<p><strong>No suite HTML reports were found.</strong> Check upstream stage logs for upload failures.</p>'
          fi
          echo '</body></html>'
        } > "$MERGED_DIR/index.html"

        echo "Merge step completed (FOUND_ANY=$FOUND_ANY)"
      displayName: 'Merge suite HTML reports'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish merged HTML reports'
      condition: succeededOrFailed()
      inputs:
        targetPath: '$(Pipeline.Workspace)/merged-html-reports'
        artifact: 'HTML Reports — All Suites'
        publishLocation: 'pipeline'

    - script: |
        set -uo pipefail
        SOURCE_DIR='$(Pipeline.Workspace)/all-reports'
        JUNIT_DIR='$(Pipeline.Workspace)/junit-results-artifact'

        rm -rf "$JUNIT_DIR"
        mkdir -p "$JUNIT_DIR"

        echo "Listing all downloaded junit artifacts under $SOURCE_DIR:"
        find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 -type d -name "junit-*"

        # Each junit-<Suite> artifact folder now contains the entire test-results
        # folder contents (screenshots, videos, traces + junit-results.xml).
        # junit-results.xml sits at the artifact root level.
        # Attachments (screenshots/videos/traces) sit in subfolders alongside it.
        # We copy the whole artifact folder into JUNIT_DIR so Azure DevOps can
        # resolve the attachment paths referenced inside junit-results.xml.
        FOUND_ANY=false
        while IFS= read -r artifactDir; do
          suiteFolder=$(basename "$artifactDir")
          suiteName=${suiteFolder#junit-}
          junitFile="$artifactDir/junit-results.xml"
          if [ -f "$junitFile" ]; then
            echo "Found junit-results.xml for suite: $suiteName"
            # Copy entire artifact folder so attachment paths remain valid
            cp -R "$artifactDir/." "$JUNIT_DIR/"
            # Rename the XML so suites don't overwrite each other
            mv "$JUNIT_DIR/junit-results.xml" "$JUNIT_DIR/junit-results-${suiteName}.xml"
            FOUND_ANY=true
          else
            echo "WARNING: $artifactDir exists but junit-results.xml not found inside it"
          fi
        done < <(find "$SOURCE_DIR" -mindepth 1 -maxdepth 1 -type d -name "junit-*" 2>/dev/null)

        if [ "$FOUND_ANY" = false ]; then
          echo "##vso[task.logissue type=warning]No junit-results.xml files found under $SOURCE_DIR."
          echo "No JUnit XML files were found in this run." > "$JUNIT_DIR/README.txt"
        fi

        echo "Collect step completed (FOUND_ANY=$FOUND_ANY)"
      displayName: 'Collect JUnit XML files'
      condition: succeededOrFailed()

    - task: PublishPipelineArtifact@1
      displayName: 'Publish JUnit XML artifact'
      condition: succeededOrFailed()
      inputs:
        targetPath: '$(Pipeline.Workspace)/junit-results-artifact'
        artifact: 'junit-results-xml'
        publishLocation: 'pipeline'

    - task: PublishTestResults@2
      displayName: 'Publish JUnit results'
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '$(Pipeline.Workspace)/junit-results-artifact/*.xml'
        testRunTitle: 'Playwright JUnit Results — ${{ parameters.environment }}'
        failTaskOnFailedTests: false

    # =====================================================
    # COMPUTE TEST SUMMARY FROM MERGED JUNIT XML
    # =====================================================
    - script: |
        python3 - <<'EOF'
        import glob
        import os
        import xml.etree.ElementTree as ET

        results_dir = os.environ["RESULTS_DIR"]

        total = 0
        passed = 0
        failed = 0
        skipped = 0

        for xml_file in glob.glob(os.path.join(results_dir, "junit-results-*.xml")):
            try:
                root = ET.parse(xml_file).getroot()
            except Exception as exc:
                print(f"Warning: could not parse JUnit file {xml_file}: {exc}")
                continue

            suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
            for suite in suites:
                tests = int(suite.get("tests", 0))
                failures = int(suite.get("failures", 0))
                errors = int(suite.get("errors", 0))
                skip = int(suite.get("skipped", 0))

                total += tests
                failed += failures + errors
                skipped += skip
                passed += tests - failures - errors - skip

        pass_pct = round((passed / total * 100), 2) if total else 0

        with open(os.path.join(results_dir, "summary.env"), "w") as summary_file:
            summary_file.write(
                f"TOTAL={total}\n"
                f"PASSED={passed}\n"
                f"FAILED={failed}\n"
                f"SKIPPED={skipped}\n"
                f"PASS_PCT={pass_pct}\n"
            )

        print(
            f"Summary: {total} tests, {passed} passed, {failed} failed, "
            f"{skipped} skipped ({pass_pct}%)."
        )
        EOF
      displayName: 'Compute Test Summary from JUnit XML'
      env:
        RESULTS_DIR: '$(Pipeline.Workspace)/junit-results-artifact'
      condition: succeededOrFailed()

    # =====================================================
    # BUILD ADAPTIVE CARD FROM SUMMARY
    # =====================================================
    - script: |
        source "$(Pipeline.Workspace)/junit-results-artifact/summary.env"

        python3 - <<EOF
        import json, os

        total = int("${TOTAL:-0}")
        passed = int("${PASSED:-0}")
        failed = int("${FAILED:-0}")
        skipped = int("${SKIPPED:-0}")
        pass_pct = "${PASS_PCT:-0}"

        pipeline_name = os.environ["PIPELINE_NAME"]
        run_id = os.environ["RUN_ID"]
        environment = os.environ["PIPELINE_ENV"]
        build_results_url = os.environ["BUILD_RESULTS_URL"]
        artifacts_url = os.environ["BUILD_ARTIFACTS_URL"]

        overall_ok = (failed == 0 and total > 0)
        status_icon = "✅" if overall_ok else "❌"
        status_text = "All Tests Passed" if overall_ok else f"{failed} Test(s) Failed"
        status_color = "Good" if overall_ok else "Attention"

        adaptive_card = {
            "type": "AdaptiveCard",
            "\$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
            "version": "1.4",
            "body": [
                {
                    "type": "TextBlock",
                    "text": f"Daily Playwright E2E Pipeline Test Summary - {environment}",
                    "weight": "Bolder",
                    "size": "Medium"
                },
                {
                    "type": "TextBlock",
                    "text": f"{status_icon} {status_text}",
                    "weight": "Bolder",
                    "color": status_color,
                    "spacing": "Small"
                },
                {
                    "type": "FactSet",
                    "facts": [
                        {"title": "🔧 Pipeline:", "value": pipeline_name},
                        {"title": "🆔 Run ID:", "value": run_id},
                        {"title": "🌐 Environment:", "value": environment},
                        {"title": "📊 Total Tests:", "value": str(total)},
                        {"title": "✅ Total Passed:", "value": str(passed)},
                        {"title": "❌ Total Failed:", "value": str(failed)},
                        {"title": "📈 Pass %:", "value": f"{pass_pct}%"}
                    ]
                }
            ],
            "actions": [
                {
                    "type": "Action.OpenUrl",
                    "title": "📂 View JUnit Results",
                    "url": build_results_url
                },
                {
                    "type": "Action.OpenUrl",
                    "title": "🌐 View HTML Reports",
                    "url": artifacts_url
                }
            ]
        }

        with open(os.path.join(os.environ["RESULTS_DIR"], "teams_card.json"), "w") as f:
            json.dump(adaptive_card, f)

        print(json.dumps(adaptive_card, indent=2))
        EOF
      displayName: 'Build Adaptive Card'
      env:
        RESULTS_DIR: '$(Pipeline.Workspace)/junit-results-artifact'
        PIPELINE_NAME: '$(Build.DefinitionName)'
        RUN_ID: '$(Build.BuildId)'
        PIPELINE_ENV: ${{ parameters.environment }}
        BUILD_RESULTS_URL: '$(System.CollectionUri)$(System.TeamProjectId)/_build/results?buildId=$(Build.BuildId)&view=ms.vss-test-web.build-test-results-tab'
        BUILD_ARTIFACTS_URL: '$(System.CollectionUri)$(System.TeamProjectId)/_build/results?buildId=$(Build.BuildId)&view=artifacts&pathAsName=false&type=publishedArtifacts'
      condition: succeededOrFailed()

    # =====================================================
    # POST ADAPTIVE CARD TO TEAMS
    # =====================================================
    - script: |
        CARD_FILE="$(Pipeline.Workspace)/junit-results-artifact/teams_card.json"

        case "${{ parameters.environment }}" in
          dev)
            WEBHOOK_URL="$TEAMS_WEBHOOK_URL_DEV"
            ;;
          int)
            WEBHOOK_URL="$TEAMS_WEBHOOK_URL_INT"
            ;;
          uat)
            WEBHOOK_URL="$TEAMS_WEBHOOK_URL_UAT"
            ;;
          *)
            echo "No Teams webhook configured for environment '${{ parameters.environment }}'. Defaulting to UAT webhook."
            WEBHOOK_URL="$TEAMS_WEBHOOK_URL_UAT"
            ;;
        esac

        if [ -z "$WEBHOOK_URL" ]; then
          echo "Resolved webhook URL is empty. Skipping Teams post."
          exit 0
        fi

        if [ ! -f "$CARD_FILE" ]; then
          echo "Adaptive Card file not found, skipping Teams post."
          exit 0
        fi

        cat "$CARD_FILE"

        curl -X POST "$WEBHOOK_URL" \
          -H "Content-Type: application/json" \
          -d @"$CARD_FILE"
      displayName: 'Post Adaptive Card to Teams'
      condition: succeededOrFailed()
      env:
        TEAMS_WEBHOOK_URL_DEV: $(teams_webhook_url_DEV)
        TEAMS_WEBHOOK_URL_UAT: $(teams_webhook_url_UAT)
        TEAMS_WEBHOOK_URL_INT: $(teams_webhook_url_INT)